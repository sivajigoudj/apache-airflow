apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-config
  namespace: airflow
data:
  airflow.cfg: |
    [core]
    executor = LocalExecutor
    dags_folder = /opt/airflow/dags
    load_examples = False
    parallelism = 16

    [database]
    sql_alchemy_conn = postgresql+psycopg2://airflow:airflow@postgres.airflow.svc.cluster.local:5432/airflow

    [scheduler]
    max_tis_per_query = 16

    [operators]
    default_owner = airflow

    [metrics]
    statsd_on = True
    statsd_host = localhost
    statsd_port = 8125
    statsd_prefix = airflow
    metrics_allow_list = airflow.*
