apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow
  namespace: airflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow
  template:
    metadata:
      labels:
        app: airflow
    spec:

      initContainers:
        - name: copy-dags
          image: busybox
          command:
            - sh
            - -c
            - |
              echo "Copying DAGs..."
              find /dags-src -type f -name "*.py" -exec cp {} /opt/airflow/dags/ \;
          volumeMounts:
            - name: dags-config
              mountPath: /dags-src
            - name: dags
              mountPath: /opt/airflow/dags

      containers:
        # 🔹 AIRFLOW SCHEDULER
        - name: airflow-scheduler
          image: sivaji9412/airflow-custom:1.4
          command: ["airflow", "scheduler"]
          envFrom:
            - configMapRef:
                name: airflow-env
          volumeMounts:
            - name: airflow-config
              mountPath: /opt/airflow/airflow.cfg
              subPath: airflow.cfg
            - name: dags
              mountPath: /opt/airflow/dags

        # 🔹 AIRFLOW WEBSERVER
        - name: airflow-webserver
          image: sivaji9412/airflow-custom:1.4
          command: ["airflow", "webserver"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: airflow-env
          volumeMounts:
            - name: airflow-config
              mountPath: /opt/airflow/airflow.cfg
              subPath: airflow.cfg
            - name: dags
              mountPath: /opt/airflow/dags

        # 🔹 STATSD EXPORTER
        - name: statsd-exporter
          image: sivaji9412/statsd-exporter:0.28.0
          args:
            - "--statsd.listen-udp=:8125"
            - "--statsd.mapping-config=/etc/statsd/mapping.yaml"
          ports:
            - name: metrics
              containerPort: 9102
            - name: statsd
              containerPort: 8125
              protocol: UDP
          volumeMounts:
            - name: statsd-mapping
              mountPath: /etc/statsd

      volumes:
        - name: airflow-config
          configMap:
            name: airflow-config
        - name: dags-config
          configMap:
            name: airflow-dags
        - name: dags
          emptyDir: {}
        - name: statsd-mapping
          configMap:
            name: statsd-mapping
