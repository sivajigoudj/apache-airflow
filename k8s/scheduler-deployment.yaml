apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-scheduler
  namespace: airflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-scheduler
  template:
    metadata:
      labels:
        app: airflow-scheduler
    spec:
      imagePullSecrets:
        - name: dockerhub-secret

      # 🔹 INIT CONTAINER (COPY DAGs - SYMLINK SAFE)
      initContainers:
        - name: copy-dags
          image: busybox
          command:
            - sh
            - -c
            - |
              echo "Copying DAGs with symlink dereference..."
              ls -la /dags-src
              find /dags-src -type f -name "*.py" -exec cp {} /opt/airflow/dags/ \;
              echo "Final DAG directory:"
              ls -la /opt/airflow/dags
          volumeMounts:
            - name: dags-config
              mountPath: /dags-src
            - name: dags
              mountPath: /opt/airflow/dags

      containers:
        - name: airflow-scheduler
          image: sivaji9412/airflow-custom:1.0
          imagePullPolicy: IfNotPresent
          command: ["airflow", "scheduler"]
          envFrom:
            - configMapRef:
                name: airflow-env
          volumeMounts:
            - name: airflow-config
              mountPath: /opt/airflow/airflow.cfg
              subPath: airflow.cfg
            - name: dags
              mountPath: /opt/airflow/dags

      volumes:
        - name: airflow-config
          configMap:
            name: airflow-config

        - name: dags-config
          configMap:
            name: airflow-dags

        - name: dags
          emptyDir: {}
