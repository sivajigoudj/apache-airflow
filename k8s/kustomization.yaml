apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: airflow

resources:
  - postgres-secret.yaml
  - postgres-deployment.yaml
  - postgres-service.yaml
  - airflow-db-init-job.yaml
  - deployment.yaml
  - scheduler-deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - poddisruptionbudget.yaml

configMapGenerator:
  - name: airflow-config
    files:
      - airflow.cfg

  - name: airflow-env
    envs:
      - env.properties

generatorOptions:
  disableNameSuffixHash: true
