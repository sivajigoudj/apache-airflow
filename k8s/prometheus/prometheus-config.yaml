apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: airflow
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: "airflow-statsd"
        static_configs:
          - targets:
              - airflow-statsd.airflow.svc.cluster.local:9102
