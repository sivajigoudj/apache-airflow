apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: airflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.2.3
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
          volumeMounts:
            # 👇 REQUIRED FOR DATASOURCE AUTO LOAD
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources

            - name: grafana-storage
              mountPath: /var/lib/grafana

      volumes:
        # 👇 DATASOURCE CONFIGMAP
        - name: grafana-datasources
          configMap:
            name: grafana-datasources

        - name: grafana-storage
          emptyDir: {}
